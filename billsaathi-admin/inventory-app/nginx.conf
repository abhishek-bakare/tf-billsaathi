server {
    # Using port 8080 because non-root users cannot bind to ports below 1024
    listen 8080;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    # Prevents Clickjacking (Loading your site in an iframe)
    add_header X-Frame-Options "SAMEORIGIN";
    
    # Prevents MIME-sniffing attacks
    add_header X-Content-Type-Options "nosniff";
    
    # Enables Cross-Site Scripting (XSS) filter in browsers
    add_header X-XSS-Protection "1; mode=block";
    
    # Controls how much referrer information is sent
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # --- ROUTING FOR REACT ---
    # This is the equivalent of vercel.json rewrites. 
    # It passes all routing to React's index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- CACHING STRATEGY ---
    # Cache static assets (images, CSS, JS) for 1 year to boost performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}